# ----------------------------------------------------------------- entries

mutation AddEntry(
  $kind: String!
  $amount: Float!
  $date: Date!
  $note: String
  $categoryId: UUID
  $paymentMethodId: UUID
  $paidCardId: UUID
) @auth(level: USER) @transaction {
  query @redact {
    member(key: { userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "Create or join a household first") {
      householdId
    }
  }
  entry_insert(
    data: {
      householdId_expr: "response.query.member.householdId"
      createdById_expr: "auth.uid"
      kind: $kind
      amount: $amount
      date: $date
      note: $note
      categoryId: $categoryId
      paymentMethodId: $paymentMethodId
      paidCardId: $paidCardId
    }
  )
}

mutation UpdateEntry(
  $id: UUID!
  $kind: String!
  $amount: Float!
  $date: Date!
  $note: String
  $categoryId: UUID
  $paymentMethodId: UUID
  $paidCardId: UUID
) @auth(level: USER) {
  entry_updateMany(
    where: {
      id: { eq: $id }
      household: {
        members_on_household: { exist: { userId: { eq_expr: "auth.uid" } } }
      }
    }
    data: {
      kind: $kind
      amount: $amount
      date: $date
      note: $note
      categoryId: $categoryId
      paymentMethodId: $paymentMethodId
      paidCardId: $paidCardId
    }
  )
}

mutation DeleteEntry($id: UUID!) @auth(level: USER) {
  entry_deleteMany(
    where: {
      id: { eq: $id }
      household: {
        members_on_household: { exist: { userId: { eq_expr: "auth.uid" } } }
      }
    }
  )
}
